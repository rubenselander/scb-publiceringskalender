name: Update dokumentation data

on:
  push:
    branches: [dokumentation]   # TEMP: while testing on the branch
  schedule:
    - cron: "41 4 * * 2"   # 04:41 UTC every Tuesday
  workflow_dispatch:
    inputs:
      sources:
        description: Which sources to fetch (space-separated subset of "scb siris sam"; empty = all)
        type: string
        default: ""
      only:
        description: For sam, only these agencies (space-separated names from dokumentation_sources.json)
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: update-dokumentation
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Fetch
        # A source that cannot be read (site down, bot check) is listed in data/dokumentation/state.json
        # and in the run summary; the others are still parsed and published, and the run stays green.
        run: python3 fetch_dokumentation.py ${{ inputs.sources }} ${{ inputs.only && format('--only {0}', inputs.only) || '' }} | tee fetch.log

      - name: Summary
        if: always()
        run: |
          {
            echo "## Sources that failed"
            python3 -c "import json; f=json.load(open('data/dokumentation/state.json')).get('last_failures', []); print('\n'.join('- ' + x for x in f) or 'none')"
            echo; echo "## Log (last 200 lines)"; echo '```'; tail -n 200 fetch.log; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Parse
        run: python3 parse_dokumentation.py

      - name: Commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/dokumentation
          git diff --cached --quiet || git commit -m "Update dokumentation data"
          git pull --rebase --quiet
          git push
