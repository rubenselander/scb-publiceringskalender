name: Update SCB data

on:
  schedule:
    - cron: "17 3 * * 1"   # 03:17 UTC every Monday
  workflow_dispatch:
    inputs:
      full:
        description: Refetch the whole calendar instead of last year onwards
        type: boolean
        default: false
      source:
        description: Refresh all sources (including calendar), or one metadata source
        type: choice
        default: all
        options:
          - all
          - products
          - subjects
          - official_agencies
          - european_agencies
          - official_products
          - hvd
          - changes

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.7"
          python-version: "3.13"

      - name: Install locked dependencies
        id: setup
        run: uv sync --locked

      - name: Verify parsers offline
        id: verify
        run: |
          uv run ruff check .
          uv run pytest -q

      - name: Fetch
        if: github.event_name == 'schedule' || inputs.source == 'all'
        run: uv run python fetch.py ${{ inputs.full && '--full' || '' }}

      - name: Parse
        if: always() && steps.setup.outcome == 'success' && (github.event_name == 'schedule' || inputs.source == 'all')
        run: uv run python parse.py

      - name: Extract metadata sources
        if: always() && steps.setup.outcome == 'success' && steps.verify.outcome == 'success'
        env:
          EXTRACT_SOURCE: ${{ inputs.source || 'all' }}
        run: uv run python -m scb_extract run --source "$EXTRACT_SOURCE" --raw-dir .extract-raw/scheduled

      - name: Archive raw responses and diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: scb-raw-${{ github.run_id }}-${{ github.run_attempt }}
          path: .extract-raw/scheduled/
          include-hidden-files: true
          retention-days: 90
          if-no-files-found: warn

      - name: Commit
        if: always()   # also keep the progress of a failed run
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Update SCB data"
          git pull --rebase --quiet
          git push
